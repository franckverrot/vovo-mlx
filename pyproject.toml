[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vovo-mlx"
version = "0.2.0"
description = "Inference for Vovo, a from-scratch English text-to-speech model, on Apple silicon with MLX."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Franck Verrot" }]
keywords = ["text-to-speech", "tts", "mlx", "apple-silicon", "speech-synthesis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mlx>=0.22",
    "mlx[cpu]>=0.22; platform_system == 'Linux'",   # Linux needs the CPU backend package (libmlx.so)
    "numpy>=1.24",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vovo-mlx = "vovo_mlx.cli:main"

[project.urls]
Homepage = "https://github.com/franckverrot/vovo-mlx"
Weights = "https://huggingface.co/franckverrot/vovo"

[tool.hatch.build.targets.wheel]
packages = ["vovo_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
